services:

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: >
      redis-server
      --maxmemory ${CACHE_MAXMEMORY:-2mb}
      --maxmemory-policy ${CACHE_EVICTION_POLICY:-allkeys-lru}
    ports:
      - "6379:6379"

#  mongodb:
#    image: mongo:7.0
#    container_name: mongodb
#    ports:
#     - "27017:27017"
#    volumes:
#      - mongodb-data:/data/db

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  traffic-generator:
    build: ./traffic-generator
    container_name: traffic-generator
    environment:
      TRAFICO_DISTRIBUCION: ${TRAFICO_DISTRIBUCION:-uniforme}
      TRAFICO_SOLICITUDES: ${TRAFICO_SOLICITUDES:-1000}
      TRAFICO_SEMILLA: ${TRAFICO_SEMILLA:-42}
      TRAFICO_ZIPF_S: ${TRAFICO_ZIPF_S:-1.2}
      TRAFICO_TASA_ARRIBO: ${TRAFICO_TASA_ARRIBO:-10}
      TRAFICO_TIPOS_CONSULTA: ${TRAFICO_TIPOS_CONSULTA:-Q1,Q2,Q3,Q4,Q5}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL:-http://cache-service:8000}
      CACHE_TIMEOUT: ${CACHE_TIMEOUT:-5}

  cache-service:
    build: ./cache-service
    container_name: cache-service
    ports:
      - "8000:8000"
    environment:
      METRICS_SERVICE_URL: http://metrics-service:8002
      METRICS_TIMEOUT: 2
      CACHE_TTL: ${CACHE_TTL:-300}
    depends_on:
      - redis
      - scraper-service
      - metrics-service

  scraper-service:
    build: ./scraper-service
    container_name: scraper-service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: futbol_chileno
      EXPERIMENTS_DIR: /results/tarea2
    volumes:
      - ./experiments/tarea2:/results/tarea2
    depends_on:
      - mongodb

  metrics-service:
    build: ./metrics-service
    container_name: metrics-service
    ports:
      - "8002:8002"

  spark-metrics:
    build: ./spark-metrics
    container_name: spark-metrics
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: futbol_chileno
      COLECCION_PARTIDOS: raw_matches
      MONGO_OUTPUT_COLLECTION: estadisticas
      SPARK_MASTER: local[*]
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - analytics
      
volumes:
  mongodb-data: